<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TBS Chuyền May</title>
<style>
html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #070d1a; }
iframe { display: block; width: 100%; height: 100%; border: 0; }
</style>
</head>
<body>
<!-- Nhúng web app Apps Script vào iframe: Google chỉ hiện banner "Ứng dụng này do một người dùng Google Apps Script tạo" khi mở trực tiếp -->
<iframe id="app" title="TBS Chuyền May" allowfullscreen></iframe>
<script>
var APP_URL = 'https://script.google.com/macros/s/AKfycbyd4ugLksm5y5o5tAAPwrKhFFT1ZBm72Erjq5ckG4tIvb3jAOe4bBgmfYer4PYBK-63/exec';
// ?line=2 trên trang này → chuyển nguyên xuống web app
document.getElementById('app').src = APP_URL + (location.search || '?line=1');
// Bấm phím trên TV: focus vào iframe để ← → Space tới được dashboard
window.onload = function () { try { document.getElementById('app').focus(); } catch (e) {} };
</script>
</body>
</html>
